<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sébastien Turpin — Photographie</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fafafa;
      color: #222;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 5%;
    }

    .logo {
      font-size: 20px;
      font-weight: 500;
    }

    nav a {
      margin-left: 25px;
      color: #222;
      text-decoration: none;
      font-size: 14px;
    }

    .hero {
      width: 90%;
      max-width: 1400px;
      margin: 40px auto;
    }

    .hero img {
      width: 100%;
      height: 70vh;
      object-fit: cover;
      display: block;
    }

    .intro {
      text-align: center;
      padding: 70px 20px;
    }

    .intro h1 {
      font-size: 42px;
      font-weight: 400;
      margin-bottom: 15px;
    }

    .intro p {
      color: #777;
      font-size: 16px;
    }

    footer {
      text-align: center;
      padding: 50px;
      color: #999;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Sébastien Turpin</div>

    <nav>
      <a href="#">Portfolio</a>
      <a href="#">À propos</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>

    <section class="hero">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=80" alt="Photographie">
    </section>

    <section class="intro">
      <h1>Photographie</h1>
      <p>Portrait · Paysage · Moments</p>
    </section>

  </main>

  <footer>
    © 2026 Sébastien Turpin
  </footer>

</body>
</html>
